---
name: Dependabot Auto-merge

on:
  pull_request:
    branches: [main]

jobs:
  dependabot-automerge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
      checks: read
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Auto-approve Dependabot PR
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: |
          echo "Auto-approving Dependabot PR for ${STEPS_METADATA_OUTPUTS_UPDATE_TYPE} update"
          gh pr review --approve "$PR_URL" \
            --body "Auto-approving Dependabot ${STEPS_METADATA_OUTPUTS_UPDATE_TYPE} update"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STEPS_METADATA_OUTPUTS_UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}

      - name: Enable auto-merge for safe updates
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: |
          echo "Enabling auto-merge for ${STEPS_METADATA_OUTPUTS_UPDATE_TYPE} update"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STEPS_METADATA_OUTPUTS_UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}

      - name: Comment on major version updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          echo "Major version update detected - requires manual review"
          gh pr comment "$PR_URL" \
            --body "🚨 **Major version update detected** - This PR requires manual review before merging as it may contain breaking changes."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
